name: Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (patch/minor/major)"
        type: choice
        options:
          - major
          - patch
          - minor
        default: "patch"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump_and_tag:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get next version
        id: semvers
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.previoustag.outputs.tag }}

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "major" ]; then
            echo "version=${{ steps.semvers.outputs.major }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.release_type }}" = "minor" ]; then
            echo "version=${{ steps.semvers.outputs.minor }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.semvers.outputs.patch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Python package version
        run: |
          set -euo pipefail
          uv version "${{ steps.version.outputs.version }}" --frozen

      - name: Commit and create tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"

          git tag "v${VERSION}"

      - name: Push commit and tag
        run: |
          set -euo pipefail
          git push --atomic origin HEAD:${{ github.ref_name }} "v${{ steps.version.outputs.version }}"

  build-and-release:
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && needs.bump_and_tag.result == 'success') || (github.event_name == 'push' && github.actor != 'github-actions[bot]')) }}
    needs:
      - bump_and_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', needs.bump_and_tag.outputs.version) || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install build dependencies
        run: |
          uv sync

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail

          SEMVER_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${{ needs.bump_and_tag.outputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "Invalid manual release version: bump_and_tag did not produce a version."
              exit 1
            fi
            TAG="v$VERSION"
          fi

          if ! [[ "$TAG" =~ $SEMVER_PATTERN ]]; then
            echo "Invalid release tag: $TAG. Expected a SemVer tag like v1.2.3."
            exit 1
          fi
          VERSION="${TAG#v}"

          PYPROJECT_VERSION="$(uv version --short)"

          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Release version $VERSION does not match pyproject.toml version $PYPROJECT_VERSION."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          uv build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          echo "Built artifacts:"
          for file in dist/*; do
            echo "  - $(basename "$file")"
          done

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            ### Downloads
            - **Wheel package**: `cached_yfinance-${{ steps.version.outputs.version }}-py3-none-any.whl`
            - **Source distribution**: `cached_yfinance-${{ steps.version.outputs.version }}.tar.gz`
            - **Docker image**: `markcallen/cached-yfinance:${{ steps.version.outputs.version }}`

            ### Installation

            #### Python Package
            ```bash
            pip install cached-yfinance==${{ steps.version.outputs.version }}
            ```

            Or download the wheel/source files below and install locally:
            ```bash
            pip install cached_yfinance-${{ steps.version.outputs.version }}-py3-none-any.whl
            ```

            #### Docker Image
            ```bash
            # Pull the specific version
            docker pull markcallen/cached-yfinance:${{ steps.version.outputs.version }}

            # Or use the latest tag
            docker pull markcallen/cached-yfinance:latest

            # Run with environment variables
            docker run --rm \
              -e TICKER=AAPL \
              -e INTERVAL=1d \
              -e DAYS=60 \
              -v $(pwd)/cache:/cache \
              markcallen/cached-yfinance:${{ steps.version.outputs.version }}
            ```

            The Docker image supports both AMD64 and ARM64 architectures.
          draft: false
          prerelease: false

      - name: Upload Wheel Artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/cached_yfinance-${{ steps.version.outputs.version }}-py3-none-any.whl
          asset_name: cached_yfinance-${{ steps.version.outputs.version }}-py3-none-any.whl
          asset_content_type: application/zip

      - name: Upload Source Distribution
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/cached_yfinance-${{ steps.version.outputs.version }}.tar.gz
          asset_name: cached_yfinance-${{ steps.version.outputs.version }}.tar.gz
          asset_content_type: application/gzip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: markcallen
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: markcallen/cached-yfinance
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

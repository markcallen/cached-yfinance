name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Lint with ruff
        run: |
          uv run ruff check .

      - name: Format check with black
        run: |
          uv run black --check .

      - name: Type check with mypy
        run: |
          uv run mypy cached_yfinance

      - name: Test with pytest
        run: |
          uv run pytest -o addopts= --ignore-glob='*e2e.py' --cov=cached_yfinance --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Validate Compose config
        run: |
          docker compose config

      - name: Start LocalStack
        run: |
          docker compose up --detach localstack

      - name: Run E2E tests
        env:
          LOCALSTACK_S3_ENDPOINT: http://127.0.0.1:4566
        run: |
          uv run pytest -o addopts= tests/test_client_e2e.py tests/test_s3_cache_e2e.py

      - name: Stop LocalStack
        if: always()
        run: |
          docker compose down --volumes
